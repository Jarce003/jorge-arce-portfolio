name: JarceDev R3F Laboratory Checks

on:
  pull_request:
    paths:
      - "experiments/r3f/**"
      - "tools/blender/**"
      - "scripts/pilot-3d-local.ps1"
      - "tsconfig.json"
      - ".github/workflows/r3f-laboratory-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experimental-scene:
    name: Experimental R3F scene (does not deploy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/r3f
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static Blender Python syntax check
        working-directory: .
        run: python3 -m py_compile tools/blender/build_assets.py
      - name: Install only sandbox dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build isolated R3F scene
        run: npm run build
      - name: Verify existing Next.js package is unchanged
        working-directory: .
        run: |
          git diff --exit-code -- package.json package-lock.json
          test -f src/components/world/world-renderer.ts

  blender-model-export:
    name: Generate and validate actual Blender GLB assets (no deployment)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Blender 4 from Ubuntu repositories
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender
          blender --version | head -1
      - name: Export original ladder truck and FireTrack station
        run: |
          blender --background --factory-startup --python tools/blender/build_assets.py
      - name: Validate generated GLB signatures, parts and mobile budgets
        run: |
          node tools/blender/verify_glb.mjs public/models/jarcedev/v1/ladder-truck.glb public/models/jarcedev/v1/firetrack-station.glb
      - name: Archive reviewable Blender and GLB assets
        uses: actions/upload-artifact@v4
        with:
          name: jarcedev-blender-models
          path: |
            public/models/jarcedev/v1/*.glb
            tools/blender/output/*.blend
          retention-days: 7
          if-no-files-found: error
