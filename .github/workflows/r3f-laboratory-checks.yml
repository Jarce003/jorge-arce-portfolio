name: JarceDev R3F Laboratory Checks

on:
  push:
    branches:
      - experiment/jarcedev-blender-r3f-pilot
    paths:
      - "experiments/r3f/**"
      - "tools/blender/**"
      - ".github/workflows/r3f-laboratory-checks.yml"
  pull_request:
    paths:
      - "experiments/r3f/**"
      - "tools/blender/**"
      - "scripts/pilot-3d-local.ps1"
      - "scripts/review-jarcedev-final.ps1"
      - "tsconfig.json"
      - ".github/workflows/r3f-laboratory-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experimental-scene:
    name: Experimental R3F scene (does not deploy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/r3f
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static Blender Python syntax check
        working-directory: .
        run: python3 -m py_compile tools/blender/build_assets.py
      - name: Install only sandbox dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build isolated R3F scene
        run: npm run build
      - name: Verify existing Next.js package is unchanged
        working-directory: .
        run: |
          git diff --exit-code -- package.json package-lock.json
          test -f src/components/world/world-renderer.ts

  blender-model-export:
    name: Generate and validate actual Blender GLB assets (no deployment)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Blender 4 from Ubuntu repositories
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy
          blender --version | head -1
      - name: Export original ladder truck and FireTrack station
        run: |
          blender --background --factory-startup --python tools/blender/build_assets.py
      - name: Validate generated GLB signatures, parts and mobile budgets
        run: |
          node tools/blender/verify_glb.mjs public/models/jarcedev/v1/ladder-truck.glb public/models/jarcedev/v1/firetrack-station.glb public/models/jarcedev/v1/evacuaplan-station.glb public/models/jarcedev/v1/acreditaciones-station.glb public/models/jarcedev/v1/hidrantes-station.glb
      - name: Archive reviewable Blender and GLB assets
        uses: actions/upload-artifact@v4
        with:
          name: jarcedev-blender-models
          path: |
            public/models/jarcedev/v1/*.glb
            tools/blender/output/*.blend
          retention-days: 7
          if-no-files-found: error

  interactive-browser:
    name: Chromium driving and fire-rescue screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    needs: [experimental-scene, blender-model-export]
    defaults:
      run:
        working-directory: experiments/r3f
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Get generated original 3D models
        uses: actions/download-artifact@v4
        with:
          name: jarcedev-blender-models
          path: .
      - name: Install isolated R3F and browser test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run pilot in headless Chromium
        run: npm run test:browser
      - name: Preserve screenshots for visual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarcedev-r3f-browser-screenshots
          path: experiments/r3f/test-artifacts/*.png
          if-no-files-found: warn
          retention-days: 7

  windows-powershell-startup:
    name: Windows PowerShell 5.1 script parser and encoding
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Node.js 22 on Windows
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install lab dependencies on Windows
        working-directory: experiments/r3f
        run: npm install --no-audit --no-fund
      - name: Build lab with parent Next.js PostCSS config on Windows
        working-directory: experiments/r3f
        run: npm run build
      - name: Parse and verify ASCII-safe startup scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'scripts/pilot-3d-local.ps1',
            'scripts/review-jarcedev-final.ps1',
            'scripts/validate-local.ps1'
          )
          foreach ($path in $paths) {
            $full = (Resolve-Path -LiteralPath $path).Path
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $full, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse error in $path"
            }
            if ($path -eq 'scripts/pilot-3d-local.ps1') {
              $nonAscii = @([System.IO.File]::ReadAllBytes($full) | Where-Object { $_ -gt 127 })
              if ($nonAscii.Count -ne 0) {
                throw "Windows PowerShell 5.1 requires ASCII or UTF-8 BOM: $path"
              }
            }
            Write-Host "Windows PowerShell 5.1 parser OK: $path" -ForegroundColor Green
          }
